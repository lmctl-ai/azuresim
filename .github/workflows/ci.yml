name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, name: linux-arm64, ext: ''}
          - {os: macos-15, name: macos-arm64, ext: ''}
          - {os: macos-15-intel, name: macos-x64, ext: ''}
          - {os: windows-2022, name: windows-x64, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential zlib1g-dev
      - name: Build standalone native executable
        run: python scripts/build.py --native
      - name: Download checksum-pinned lmazure client
        run: python scripts/fetch-client.py
      - name: Test standalone executable
        run: |
          mkdir -p dist
          cp 'target/azuresim${{ matrix.ext }}' 'dist/azuresim-${{ matrix.name }}${{ matrix.ext }}'
          python scripts/test-cli.py 'dist/azuresim-${{ matrix.name }}${{ matrix.ext }}'
          python scripts/test-storage.py 'dist/azuresim-${{ matrix.name }}${{ matrix.ext }}'
          python scripts/test-auth.py 'dist/azuresim-${{ matrix.name }}${{ matrix.ext }}'
          python scripts/test-lmazure.py 'dist/azuresim-${{ matrix.name }}${{ matrix.ext }}' 'target/lmazure${{ matrix.ext }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          cp LICENSE THIRD_PARTY_NOTICES.md FLOCI-AZ-LICENSE upstream.lock.json client.lock.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "azuresim $GITHUB_REF_NAME" --generate-notes
